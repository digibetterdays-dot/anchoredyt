<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root { --ground:#0e1a2b; --ink:#ffffff; --red:#c1121f; --amber:#ffb703; --font-display: sans-serif; }
      * { margin:0; padding:0; box-sizing:border-box; }
      html, body { width:1080px; height:1920px; overflow:hidden; background:var(--ground); }
      #root { position:relative; width:100%; height:100%; font-family:var(--font-display); color:var(--ink); }
      .abs { position:absolute; }
      #road { left:0; top:1330px; width:1080px; height:590px; background:#1b2a41; }
      #q { left:60px; width:960px; top:190px; text-align:center; font-size:80px; font-weight:800; line-height:1.05; }
      #body { left:90px; top:430px; width:900px; height:560px; background:#f4f6f8; border-radius:36px; }
      #stripe { left:90px; top:760px; width:900px; height:70px; background:var(--red); }
      #lightL, #lightR { top:400px; width:150px; height:70px; border-radius:20px; }
      #lightL { left:170px; background:#2a6df4; }
      #lightR { left:760px; background:var(--red); }
      #plate { left:190px; top:520px; width:700px; height:200px; display:flex; align-items:center; justify-content:center; }
      #plate .flip { font-size:96px; font-weight:900; letter-spacing:3px; color:var(--red); display:inline-block; transform:scaleX(-1); }
      #wheelL, #wheelR { top:950px; width:150px; height:150px; border-radius:50%; background:#111; border:14px solid #555; }
      #wheelL { left:190px; } #wheelR { left:740px; }
      #mirror { left:140px; top:500px; width:800px; height:640px; border-radius:60px; border:22px solid #c8d0da; background:#25364f; overflow:hidden; }
      #mirror .glass { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
      #mirror .flip2 { display:inline-block; }
      #mirror .word { font-size:84px; font-weight:900; letter-spacing:2px; color:#ff8a8a; display:inline-block; transform:scaleX(-1); }
      .cap { left:60px; width:960px; text-align:center; font-size:76px; font-weight:800; line-height:1.1; top:1210px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="14" data-width="1080" data-height="1920">
      <div id="road" class="abs"></div>

      <div id="q" class="abs clip" data-start="0" data-duration="3.2" data-track-index="1">Why is AMBULANCE written backwards?</div>

      <div id="truck" class="abs clip" data-start="0" data-duration="6.4" data-track-index="2" style="left:0;top:80px;width:1080px;height:1920px;">
        <div id="body" class="abs"></div>
        <div id="stripe" class="abs"></div>
        <div id="lightL" class="abs"></div>
        <div id="lightR" class="abs"></div>
        <div id="plate" class="abs"><span class="flip">AMBULANCE</span></div>
        <div id="wheelL" class="abs"></div>
        <div id="wheelR" class="abs"></div>
      </div>

      <div id="cap1" class="cap abs clip" data-start="3.2" data-duration="3.2" data-track-index="3">Not for you.<br />For the driver in front.</div>

      <div id="mirror" class="abs clip" data-start="6.4" data-duration="5.2" data-track-index="2">
        <div id="glass" class="glass"><div id="flipwrap" class="flip2"><span class="word">AMBULANCE</span></div></div>
      </div>
      <div id="cap2" class="cap abs clip" data-start="7.2" data-duration="4.4" data-track-index="3">The mirror flips it back.<br />Instant read.</div>

      <div id="cap3" class="abs clip" data-start="11.6" data-duration="2.4" data-track-index="3" style="left:60px;width:960px;top:560px;text-align:center;font-size:104px;font-weight:900;line-height:1.1;">Check your mirror.</div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#q", { opacity:1, y:30 }, { opacity:1, y:0, duration:0.3, ease:"power3.out" }, 0);
      tl.fromTo("#truck", { x:-120, opacity:1 }, { x:0, opacity:1, duration:0.5, ease:"power3.out" }, 0);
      tl.fromTo("#lightL", { opacity:1 }, { opacity:0.25, duration:0.25, repeat:11, yoyo:true, ease:"none" }, 0.2);
      tl.fromTo("#lightR", { opacity:0.25 }, { opacity:1, duration:0.25, repeat:11, yoyo:true, ease:"none" }, 0.2);
      tl.fromTo("#cap1", { opacity:0, y:30 }, { opacity:1, y:0, duration:0.3, ease:"power3.out" }, 3.2);
      tl.fromTo("#mirror", { opacity:0, scale:0.9 }, { opacity:1, scale:1, duration:0.4, ease:"power3.out" }, 6.4);
      // the mirror flips the mirrored word: tween the wrapper from normal (-1 net = unreadable) to flipped (readable)
      tl.fromTo("#flipwrap", { scaleX:1 }, { scaleX:-1, duration:0.9, ease:"power2.inOut" }, 7.0);
      tl.fromTo("#cap2", { opacity:0, y:30 }, { opacity:1, y:0, duration:0.3, ease:"power3.out" }, 7.2);
      tl.fromTo("#cap3", { opacity:0, scale:0.9 }, { opacity:1, scale:1, duration:0.3, ease:"back.out(2)" }, 11.6);
      tl.fromTo("#glass", { scale:1 }, { scale:1.05, duration:0.8, repeat:3, yoyo:true, ease:"sine.inOut" }, 8.0);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
